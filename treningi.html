<!DOCTYPE html> 
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPlan - Plan Treningowy</title>
    
    <style>
        /* === GŁÓWNE STYLE I KOLORY === */
        :root {
            --bg-color: #050505;
            --card-bg: #121212;
            --card-border: #222222;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-color: #d4a373;
            --accent-hover: #b0865c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* === NAWIGACJA GÓRNA === */
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 30px 0; flex-wrap: wrap; gap: 15px; }
        .logo { color: var(--accent-color); font-size: 22px; font-weight: bold; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        header nav { display: flex; gap: 20px; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
        header nav a { color: var(--text-muted); text-decoration: none; text-transform: uppercase; }
        header nav a:hover { color: var(--text-main); }
        header nav a.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 5px; }

        /* === NAWIGACJA MOBILNA === */
        .mobile-nav { display: none; background-color: var(--bg-color); border-top: 1px solid var(--card-border); position: fixed; bottom: 0; left: 0; width: 100%; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .mobile-nav a { color: var(--text-muted); text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-transform: uppercase; }
        .mobile-nav a.active { color: var(--accent-color); }
        .mobile-nav .icon { font-size: 20px; }

        /* === WIDOK TRENINGU === */
        .week-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .week-selector {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
        }

        .btn-nav {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }
        .btn-nav:hover { color: var(--accent-color); }

        .btn-outline {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-outline:hover { background: var(--accent-color); color: #000; }

        .day-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .day-title {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rest-day {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .add-workout-btn {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px dashed var(--accent-color);
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            transition: 0.3s;
        }

        .add-workout-btn:hover {
            background-color: rgba(212, 163, 115, 0.1);
        }

        /* === MEDIA QUERIES === */
        @media (max-width: 900px) {
            body { padding-bottom: 80px; }
            header nav { display: none; }
            .mobile-nav { display: flex; }
        }
    </style>
</head>
<body>

    <!-- GÓRNA NAWIGACJA -->
    <header>
        <div class="logo"><span>||=</span> FITPLAN</div>
        <nav>
            <a href="index.html">PULPIT</a>
            <a href="dieta.html">DIETA</a>
            <a href="trening.html" class="active">TRENING</a>
            <a href="postepy.html">POSTĘPY</a>
            <a href="kalkulator.html">KALKULATOR</a>
        </nav>
        <div style="color: var(--text-muted); font-size: 20px;">⚙</div>
    </header>

    <main style="max-width: 800px; margin: 0 auto;">
        
        <!-- WYBÓR TYGODNIA -->
        <div class="week-header">
            <div style="color: var(--text-muted); font-size: 12px; text-transform: uppercase;">Harmonogram</div>
            <div class="week-selector">
                <button class="btn-nav">&lt;</button>
                <span>Tydzień 1</span>
                <button class="btn-nav">&gt;</button>
            </div>
            <button class="btn-outline">ZOBACZ KALENDARZ</button>
        </div>

        <!-- PONIEDZIAŁEK -->
        <div class="day-card">
            <div class="day-header">
                <div class="day-title"><span style="color: var(--accent-color);">Dzień 1</span> | Poniedziałek</div>
            </div>
            <button class="add-workout-btn">+ Dodaj trening</button>
        </div>

        <!-- WTOREK -->
        <div class="day-card">
            <div class="day-header">
                <div class="day-title"><span style="color: var(--accent-color);">Dzień 2</span> | Wtorek</div>
            </div>
            <button class="add-workout-btn">+ Dodaj trening</button>
        </div>

        <!-- ŚRODA -->
        <div class="day-card">
            <div class="day-header">
                <div class="day-title"><span style="color: var(--accent-color);">Dzień 3</span> | Środa</div>
            </div>
            <button class="add-workout-btn">+ Dodaj trening</button>
        </div>

        <!-- CZWARTEK -->
        <div class="day-card">
            <div class="day-header">
                <div class="day-title"><span style="color: var(--accent-color);">Dzień 4</span> | Czwartek</div>
            </div>
            <button class="add-workout-btn">+ Dodaj trening</button>
        </div>

        <!-- PIĄTEK -->
        <div class="day-card">
            <div class="day-header">
                <div class="day-title"><span style="color: var(--accent-color);">Dzień 5</span> | Piątek</div>
            </div>
            <button class="add-workout-btn">+ Dodaj trening</button>
        </div>

        <!-- SOBOTA -->
        <div class="day-card">
            <div class="day-header">
                <div class="day-title"><span style="color: var(--accent-color);">Dzień 6</span> | Sobota</div>
            </div>
            <button class="add-workout-btn">+ Dodaj trening</button>
        </div>

        <!-- NIEDZIELA (PRZYKŁADOWY DZIEŃ ODPOCZYNKU) -->
        <div class="day-card" style="opacity: 0.7;">
            <div class="day-header" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
                <div class="day-title"><span style="color: var(--accent-color);">Dzień 7</span> | Niedziela</div>
                <div class="rest-day">☕ Dzień odpoczynku</div>
            </div>
        </div>

    </main>

    <!-- DOLNA NAWIGACJA -->
    <nav class="mobile-nav">
        <a href="index.html"><span class="icon">🏠</span><span>Pulpit</span></a>
        <a href="dieta.html"><span class="icon">🍴</span><span>Dieta</span></a>
        <a href="trening.html" class="active"><span class="icon">🏋️</span><span>Trening</span></a>
        <a href="postepy.html"><span class="icon">📈</span><span>Postępy</span></a>
        <a href="kalkulator.html"><span class="icon">🧮</span><span>Kalkulator</span></a>
    </nav>

</body>
</html>
