<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPlan - Twoje Postępy</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4a373">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Supabase & Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --bg-color: #050505; --card-bg: #121212; --card-border: #222222; --text-main: #ffffff; --text-muted: #888888; --accent-color: #d4a373; --accent-hover: #b0865c; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 30px 0; flex-wrap: wrap; gap: 15px; }
        .logo { color: var(--accent-color); font-size: 22px; font-weight: bold; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        header nav { display: flex; gap: 20px; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
        header nav a { color: var(--text-muted); text-decoration: none; text-transform: uppercase; }
        header nav a:hover { color: var(--text-main); }
        header nav a.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 5px; }
        .gear-icon { color: var(--text-muted); font-size: 20px; text-decoration: none; transition: 0.3s; }
        .gear-icon:hover { color: var(--text-main); }
        .mobile-nav { display: none; background-color: var(--bg-color); border-top: 1px solid var(--card-border); position: fixed; bottom: 0; left: 0; width: 100%; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .mobile-nav a { color: var(--text-muted); text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-transform: uppercase; }
        .mobile-nav a.active { color: var(--accent-color); }
        .mobile-nav .icon { font-size: 20px; }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-title { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .btn { background-color: var(--accent-color); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; transition: 0.3s; }
        .btn:hover { background-color: var(--accent-hover); }

        .card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        
        /* Zmiana kontenera wykresu pod Chart.js */
        .chart-container { position: relative; height: 250px; width: 100%; display: flex; justify-content: center; align-items: center; }

        .history-list { display: flex; flex-direction: column; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--card-border); }
        .history-item:last-child { border-bottom: none; padding-bottom: 0; }
        .history-date { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .history-data { display: flex; gap: 20px; }
        .data-point { display: flex; flex-direction: column; }
        .data-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
        .data-value { font-size: 16px; font-weight: bold; color: var(--text-main); }

        /* MODAL */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background-color: var(--card-bg); border: 1px solid var(--accent-color); border-radius: 12px; padding: 25px; width: 90%; max-width: 400px; }
        .modal-content h3 { margin-top: 0; color: var(--accent-color); }
        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-muted); }
        .input-group input { background-color: var(--bg-color); border: 1px solid var(--card-border); color: white; padding: 12px; border-radius: 6px; outline: none; font-family: inherit; }
        .input-group input:focus { border-color: var(--accent-color); }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save { background-color: var(--accent-color); color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-cancel { background-color: transparent; color: white; border: 1px solid var(--text-muted); padding: 10px; border-radius: 6px; cursor: pointer; flex: 1; }

        @media (max-width: 900px) { body { padding-bottom: 80px; } header nav { display: none; } .mobile-nav { display: flex; } .history-item { flex-direction: column; align-items: flex-start; gap: 15px; } .history-data { width: 100%; justify-content: space-between; } }

                /* --- ANIMACJE SWIPE (MOBILNE) --- */
        body { 
            animation: swipeIn 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
            overflow-x: hidden; /* Zapobiega pojawianiu się paska przewijania z boku */
        }
        .page-exit { 
            animation: swipeOut 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; 
        }
        @keyframes swipeIn { 
            0% { opacity: 0; transform: translateX(40px); } 
            100% { opacity: 1; transform: translateX(0); } 
        }
        @keyframes swipeOut { 
            0% { opacity: 1; transform: translateX(0); } 
            100% { opacity: 0; transform: translateX(-40px); } 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>||=</span> FITPLAN</div>
        <nav>
            <a href="index.html">PULPIT</a>
            <a href="dieta.html">DIETA</a>
            <a href="trening.html">TRENING</a>
            <a href="postepy.html" class="active">POSTĘPY</a>
            <a href="kalkulator.html">KALKULATOR</a>
        </nav>
        <a href="ustawienia.html" class="gear-icon">⚙</a>
    </header>

    <main style="max-width: 800px; margin: 0 auto;">
        
        <div class="header-actions">
            <div class="page-title"><span style="color: var(--accent-color);">📈</span> Raport Postępów</div>
            <button class="btn" onclick="openModal()">+ Dodaj pomiar</button>
        </div>

        <!-- MIEJSCE NA NOWY WYKRES -->
        <div class="card">
            <h3 style="margin-top: 0; font-size: 14px; color: var(--text-muted); text-transform: uppercase;">Zmiana Wagi</h3>
            <div class="chart-container">
                <!-- Tu Chart.js narysuje wykres -->
                <canvas id="weightChart"></canvas>
            </div>
        </div>

        <!-- HISTORIA POMIARÓW -->
        <div class="card">
            <h3 style="margin-top: 0; font-size: 14px; color: var(--text-muted); text-transform: uppercase;">Historia Pomiarów</h3>
            <div class="history-list" id="history-list-container">
                <div class="history-item" style="justify-content: center; opacity: 0.5;">
                    <span style="font-size: 13px;">Ładowanie danych...</span>
                </div>
            </div>
        </div>

    </main>

    <!-- UKRYTE OKIENKO (MODAL) -->
    <div class="modal-overlay" id="measurement-modal">
        <div class="modal-content">
            <h3>Dodaj nowy pomiar</h3>
            
            <div class="input-group">
                <label>Waga (kg)</label>
                <input type="number" step="0.1" id="add-weight" placeholder="np. 80.5">
            </div>
            <div class="input-group">
                <label>Obwód w talii (cm) - opcjonalnie</label>
                <input type="number" step="0.5" id="add-waist" placeholder="np. 85">
            </div>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Anuluj</button>
                <button class="btn-save" onclick="saveMeasurement()">Zapisz</button>
            </div>
        </div>
    </div>

    <nav class="mobile-nav">
        <a href="index.html"><span class="icon">🏠</span><span>Pulpit</span></a>
        <a href="dieta.html"><span class="icon">🍴</span><span>Dieta</span></a>
        <a href="trening.html"><span class="icon">🏋️</span><span>Trening</span></a>
        <a href="postepy.html" class="active"><span class="icon">📈</span><span>Postępy</span></a>
        <a href="kalkulator.html"><span class="icon">🧮</span><span>Kalkulator</span></a>
    </nav>

    <!-- SKRYPT SUPABASE & CHART.JS -->
    <script>
        // Animacje Przejść
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                const target = this.getAttribute('href');
                if(target && target.includes('.html')) {
                    e.preventDefault();
                    document.body.classList.add('page-exit');
                    setTimeout(() => { window.location.href = target; }, 300);
                }
            });
        });

        const supabaseUrl = 'https://ttgeuikoyfcgiboajhcf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0Z2V1aWtveWZjZ2lib2FqaGNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzQwODQsImV4cCI6MjEwMjU1MDA4NH0.bdBemCIUCBkbrJx2h9iN44OuQIAmeGkTTQjwRMev-G4';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let weightChartInstance = null; // Zmienna przechowująca nasz wykres

        // 1. POBIERANIE I WYSWIETLANIE HISTORII
        async function loadHistory() {
            const { data, error } = await supabaseClient
                .from('progress_history')
                .select('*')
                .order('created_at', { ascending: false }); // Najpierw najnowsze (do listy)

            const listContainer = document.getElementById('history-list-container');
            
            if (error) {
                console.error("Błąd pobierania historii:", error);
                return;
            }

            if (!data || data.length === 0) {
                listContainer.innerHTML = '<div class="history-item" style="justify-content: center; opacity: 0.5;"><span style="font-size: 13px;">Jeszcze nic tu nie ma. Kliknij "+ Dodaj pomiar" u góry.</span></div>';
                renderChart([], []); // Pusty wykres
                return;
            }

            // LISTA: Renderowanie od najnowszego
            listContainer.innerHTML = '';
            data.forEach(item => {
                const dateObj = new Date(item.created_at);
                const dateString = dateObj.toLocaleDateString('pl-PL') + ', ' + dateObj.toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit'});
                const waistHtml = item.waist ? `<div class="data-point"><span class="data-label">Talia</span><span class="data-value">${item.waist} cm</span></div>` : '';

                const html = `
                <div class="history-item">
                    <div>
                        <div class="history-date">${dateString}</div>
                        <div style="font-weight: bold; color: var(--accent-color);">Wpis na osi czasu</div>
                    </div>
                    <div class="history-data">
                        <div class="data-point">
                            <span class="data-label">Waga</span>
                            <span class="data-value">${item.weight} kg</span>
                        </div>
                        ${waistHtml}
                    </div>
                </div>`;
                listContainer.innerHTML += html;
            });

            // WYKRES: Potrzebujemy chronologii, więc odwracamy tablicę (od najstarszego do najnowszego)
            const chartData = [...data].reverse();
            
            const labels = chartData.map(item => {
                const d = new Date(item.created_at);
                return d.toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit' }); // Zwraca np. "15.10"
            });
            const weights = chartData.map(item => parseFloat(item.weight));

            renderChart(labels, weights);
        }

        // 2. RYSOWANIE WYKRESU (CHART.JS)
        function renderChart(labels, dataPoints) {
            const ctx = document.getElementById('weightChart').getContext('2d');
            
            // Jeśli wykres już istnieje, niszczymy go przed narysowaniem nowej wersji
            if (weightChartInstance) {
                weightChartInstance.destroy();
            }

            // Globalne ustawienia kolorów pod nasz ciemny motyw
            Chart.defaults.color = '#888888';
            Chart.defaults.font.family = "'Segoe UI', Roboto, Helvetica, Arial, sans-serif";

            weightChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Waga (kg)',
                        data: dataPoints,
                        borderColor: '#d4a373', // Nasz złoty kolor (linia)
                        backgroundColor: 'rgba(212, 163, 115, 0.15)', // Wypełnienie pod linią
                        borderWidth: 3,
                        pointBackgroundColor: '#121212', // Kropki na wykresie
                        pointBorderColor: '#d4a373',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        fill: true,
                        tension: 0.4 // Gładkie zaokrąglenia linii
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }, // Ukrywamy legendę z góry
                        tooltip: {
                            backgroundColor: '#1a1a1a',
                            titleColor: '#d4a373',
                            bodyColor: '#fff',
                            borderColor: '#333',
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false // Ukrywa kwadracik koloru w dymku
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: '#222', drawBorder: false }
                        },
                        y: {
                            grid: { color: '#222', drawBorder: false },
                            // Wykres automatycznie dobierze sobie idealną skalę (minimum i maksimum)
                        }
                    }
                }
            });
        }

        loadHistory();

        function openModal() {
            document.getElementById('add-weight').value = '';
            document.getElementById('add-waist').value = '';
            document.getElementById('measurement-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('measurement-modal').style.display = 'none';
        }

        async function saveMeasurement() {
            const weightVal = parseFloat(document.getElementById('add-weight').value);
            const waistVal = parseFloat(document.getElementById('add-waist').value);

            if (!weightVal) {
                alert("Podaj przynajmniej swoją wagę!");
                return;
            }

            const insertData = { weight: weightVal };
            if (waistVal) insertData.waist = waistVal;

            const { error } = await supabaseClient
                .from('progress_history')
                .insert([insertData]);

            if (!error) {
                closeModal();
                loadHistory(); // Po zapisaniu, odświeżamy liste. Wykres zaktualizuje się SAAAM!
            } else {
                console.error("Błąd zapisu:", error);
                alert("Wystąpił błąd przy zapisie pomiaru.");
            }
        }
    </script>
</body>
</html>
