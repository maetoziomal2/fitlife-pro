<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPlan - Plan Treningowy</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4a373">
    <link rel="apple-touch-icon" href="icon.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --bg-color: #050505; --card-bg: #121212; --card-border: #222222; --text-main: #ffffff; --text-muted: #888888; --accent-color: #d4a373; --accent-hover: #b0865c; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 30px 0; flex-wrap: wrap; gap: 15px; }
        .logo { color: var(--accent-color); font-size: 22px; font-weight: bold; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        header nav { display: flex; gap: 20px; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
        header nav a { color: var(--text-muted); text-decoration: none; text-transform: uppercase; }
        header nav a:hover { color: var(--text-main); }
        header nav a.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 5px; }
        .gear-icon { color: var(--text-muted); font-size: 20px; text-decoration: none; transition: 0.3s; }
        .gear-icon:hover { color: var(--text-main); }
        .mobile-nav { display: none; background-color: var(--bg-color); border-top: 1px solid var(--card-border); position: fixed; bottom: 0; left: 0; width: 100%; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .mobile-nav a { color: var(--text-muted); text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-transform: uppercase; }
        .mobile-nav a.active { color: var(--accent-color); }
        .mobile-nav .icon { font-size: 20px; }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background-color: var(--card-bg); border: 1px solid var(--card-border); padding: 15px 20px; border-radius: 12px; flex-wrap: wrap; gap: 15px; }
        .month-selector { display: flex; align-items: center; gap: 15px; font-weight: bold; text-transform: uppercase; font-size: 14px; margin: 0 auto; }
        .month-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 5px 10px; }
        .month-btn:hover { color: var(--accent-color); }
        
        .btn { background-color: var(--accent-color); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; transition: 0.3s; }
        .btn:hover { background-color: var(--accent-hover); }
        .btn-outline { background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color); padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; transition: 0.3s; }
        
        .action-buttons { display: flex; gap: 10px; width: 100%; justify-content: center; }

        /* KARTY TRENINGOWE */
        .workout-list { display: flex; flex-direction: column; gap: 15px; }
        .workout-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; align-items: flex-start; transition: 0.3s; }
        .workout-card.completed { opacity: 0.5; border-color: #333; }
        .workout-card.completed .workout-title { text-decoration: line-through; color: var(--text-muted); }
        
        .workout-info { display: flex; gap: 15px; }
        .workout-date-box { background-color: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 10px; min-width: 50px; text-align: center; display: flex; flex-direction: column; justify-content: center; height: max-content; }
        .workout-day { font-size: 22px; font-weight: bold; color: var(--accent-color); line-height: 1; }
        .workout-weekday { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-top: 5px; }
        
        .workout-details { display: flex; flex-direction: column; gap: 5px; justify-content: center; }
        .workout-title { font-size: 16px; font-weight: bold; margin: 0; }
        .workout-desc { font-size: 12px; color: var(--text-muted); margin: 0; white-space: pre-wrap; }
        
        .checkbox-container { display: flex; align-items: center; justify-content: center; padding: 10px; cursor: pointer; }
        .custom-checkbox { width: 24px; height: 24px; border: 2px solid var(--text-muted); border-radius: 6px; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .workout-card.completed .custom-checkbox { background-color: var(--accent-color); border-color: var(--accent-color); color: #000; }
        .custom-checkbox::after { content: '✔'; display: none; font-size: 14px; font-weight: bold; }
        .workout-card.completed .custom-checkbox::after { display: block; }

        /* MODAL */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background-color: var(--card-bg); border: 1px solid var(--accent-color); border-radius: 12px; padding: 25px; width: 90%; max-width: 400px; }
        .modal-content h3 { margin-top: 0; color: var(--accent-color); }
        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-muted); }
        .input-group input, .input-group textarea { background-color: var(--bg-color); border: 1px solid var(--card-border); color: white; padding: 12px; border-radius: 6px; outline: none; font-family: inherit; width: 90%; }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--accent-color); }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save { background-color: var(--accent-color); color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-cancel { background-color: transparent; color: white; border: 1px solid var(--text-muted); padding: 10px; border-radius: 6px; cursor: pointer; flex: 1; }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); border: 1px dashed var(--card-border); border-radius: 12px; }

        /* --- STOPER (PŁYWAJĄCY WIDŻET) --- */
        .floating-timer {
            position: fixed;
            bottom: 90px;
            right: 20px;
            background-color: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 30px;
            padding: 15px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--accent-color);
            font-size: 24px;
        }
        .floating-timer.expanded {
            border-radius: 12px;
            flex-direction: column;
            padding: 15px;
            right: 50%;
            transform: translateX(50%);
            width: 260px;
            cursor: default;
        }
        .timer-display { font-size: 32px; font-weight: bold; margin-bottom: 15px; color: var(--text-main); text-align: center; }
        .timer-buttons { display: flex; gap: 8px; justify-content: center; width: 100%; }
        .timer-buttons button { background-color: var(--accent-color); color: #000; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; font-size: 14px; }
        .timer-buttons button.stop { background-color: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); }

        @media (max-width: 900px) { body { padding-bottom: 80px; } header nav { display: none; } .mobile-nav { display: flex; } }

                        /* --- BŁYSKAWICZNY SWIPE (MOBILNE) --- */
        body { 
            animation: swipeIn 0.2s cubic-bezier(0.25, 1, 0.5, 1); 
            overflow-x: hidden; 
        }
        .page-exit { 
            animation: swipeOut 0.15s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; 
        }
        @keyframes swipeIn { 
            0% { opacity: 0; transform: translateX(20px); } 
            100% { opacity: 1; transform: translateX(0); } 
        }
        @keyframes swipeOut { 
            0% { opacity: 1; transform: translateX(0); } 
            100% { opacity: 0; transform: translateX(-20px); } 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>||=</span> FITPLAN</div>
        <nav>
            <a href="index.html">PULPIT</a>
            <a href="dieta.html">DIETA</a>
            <a href="trening.html" class="active">TRENING</a>
            <a href="postepy.html">POSTĘPY</a>
            <a href="kalkulator.html">KALKULATOR</a>
        </nav>
        <a href="ustawienia.html" class="gear-icon">⚙</a>
    </header>

    <main style="max-width: 800px; margin: 0 auto;">
        
        <div class="header-actions">
            <div class="month-selector">
                <button class="month-btn" onclick="changeMonth(-1)">&lt;</button>
                <span id="month-display" style="min-width: 130px; text-align: center;">Ładowanie...</span>
                <button class="month-btn" onclick="changeMonth(1)">&gt;</button>
            </div>
            <div class="action-buttons">
                <!-- NOWY PRZYCISK KOPIOWANIA -->
                <button class="btn-outline" onclick="copyPlan()">📋 Kopiuj plan (+4 tyg)</button>
                <button class="btn" onclick="openModal()">+ Zaplanuj</button>
            </div>
        </div>

        <div class="workout-list" id="workout-list-container">
            <div class="empty-state">Ładowanie treningów...</div>
        </div>

    </main>

    <!-- WIDŻET STOPERA -->
    <div id="floating-timer" class="floating-timer" onclick="toggleTimer(event)">
        <span id="timer-icon">⏱️</span>
        <div id="timer-expanded-content" style="display: none; width: 100%;">
            <div class="timer-display" id="timer-display">00:00</div>
            <div class="timer-buttons">
                <button onclick="startTimer(60, event)">60s</button>
                <button onclick="startTimer(90, event)">90s</button>
                <button onclick="startTimer(120, event)">120s</button>
                <button class="stop" onclick="stopTimer(event)">⏹</button>
            </div>
        </div>
    </div>

    <!-- OKIENKO (MODAL) DO DODAWANIA TRENINGU -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal-content">
            <h3>Zaplanuj Trening</h3>
            <div class="input-group">
                <label>Data treningu</label>
                <input type="date" id="add-date" required>
            </div>
            <div class="input-group">
                <label>Nazwa (np. Góra Ciała, Push, Nogi)</label>
                <input type="text" id="add-title" placeholder="Co będziesz trenować?" required>
            </div>
            <div class="input-group">
                <label>Notatki / Ćwiczenia (opcjonalnie)</label>
                <textarea id="add-details" rows="4" placeholder="Wypisz ćwiczenia..."></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Anuluj</button>
                <button class="btn-save" onclick="saveWorkout()">Zapisz</button>
            </div>
        </div>
    </div>

    <nav class="mobile-nav">
        <a href="index.html"><span class="icon">🏠</span><span>Pulpit</span></a>
        <a href="dieta.html"><span class="icon">🍴</span><span>Dieta</span></a>
        <a href="trening.html" class="active"><span class="icon">🏋️</span><span>Trening</span></a>
        <a href="postepy.html"><span class="icon">📈</span><span>Postępy</span></a>
        <a href="kalkulator.html"><span class="icon">🧮</span><span>Kalkulator</span></a>
    </nav>

    <script>
        // Animacje Przejść
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                const target = this.getAttribute('href');
                if(target && target.includes('.html')) {
                    e.preventDefault();
                    document.body.classList.add('page-exit');
                    setTimeout(() => { window.location.href = target; }, 150);
                }
            });
        });

        const supabaseUrl = 'https://ttgeuikoyfcgiboajhcf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0Z2V1aWtveWZjZ2lib2FqaGNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzQwODQsImV4cCI6MjEwMjU1MDA4NH0.bdBemCIUCBkbrJx2h9iN44OuQIAmeGkTTQjwRMev-G4';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let currentDate = new Date();
        const monthNames = ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"];
        const dayNames = ["Ndz", "Pon", "Wto", "Śro", "Czw", "Pią", "Sob"];

        // ====== 1. SYSTEM KOPIOWANIA TRENINGÓW ======
        async function copyPlan() {
            // Obliczamy ramy czasowe obecnego miesiąca
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1).toISOString().split('T')[0];
            const lastDay = new Date(year, month + 1, 0).toISOString().split('T')[0];

            // Pobieramy treningi z tego widoku
            const { data, error } = await supabaseClient
                .from('workout_plan')
                .select('*')
                .gte('scheduled_date', firstDay)
                .lte('scheduled_date', lastDay);

            if (error || !data || data.length === 0) {
                alert("Nie masz żadnych zaplanowanych treningów w tym miesiącu, więc nie ma czego skopiować.");
                return;
            }

            const confirmCopy = confirm(`Znaleziono ${data.length} treningów w tym miesiącu. Czy skopiować ten plan idealnie w te same dni tygodnia na następne 4 tygodnie?`);
            if(!confirmCopy) return;

            // Dodajemy dokładnie 28 dni do każdego treningu (4 tygodnie, więc poniedziałek trafia w poniedziałek)
            const newWorkouts = data.map(workout => {
                const oldDate = new Date(workout.scheduled_date);
                oldDate.setDate(oldDate.getDate() + 28);
                const newDateString = oldDate.toISOString().split('T')[0];
                
                return {
                    scheduled_date: newDateString,
                    title: workout.title,
                    details: workout.details,
                    is_completed: false // Nowe treningi są domyślnie "niezrobione"
                };
            });

            // Wrzucamy pęczek do bazy
            const { error: insertError } = await supabaseClient.from('workout_plan').insert(newWorkouts);

            if(!insertError) {
                alert("Wooohoo! Cały plan został powielony o 4 tygodnie do przodu!");
                changeMonth(1); // Automatycznie przesuwa widok kalendarza do przodu
            } else {
                alert("Coś poszło nie tak podczas kopiowania...");
            }
        }

        // ====== 2. WIDŻET STOPERA TRENINGOWEGO ======
        let timerInterval;
        let timeLeft = 0;
        const timerEl = document.getElementById('floating-timer');
        const timerIcon = document.getElementById('timer-icon');
        const timerContent = document.getElementById('timer-expanded-content');
        const timerDisplay = document.getElementById('timer-display');

        function toggleTimer(event) {
            // Zapobiega zamknięciu timera gdy klikasz w jego przyciski
            if(event.target.tagName === 'BUTTON') return; 

            if (timerEl.classList.contains('expanded')) {
                timerEl.classList.remove('expanded');
                timerIcon.style.display = 'block';
                timerContent.style.display = 'none';
            } else {
                timerEl.classList.add('expanded');
                timerIcon.style.display = 'none';
                timerContent.style.display = 'block';
            }
        }

        function startTimer(seconds, event) {
            event.stopPropagation(); // Zapobiega ukryciu panelu przy kliknięciu przycisku
            clearInterval(timerInterval);
            timeLeft = seconds;
            updateDisplay();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerText = "KONIEC!";
                    // Wibracje na telefonie (jeśli obsługiwane)
                    if(navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);
                }
            }, 1000);
        }

        function stopTimer(event) {
            event.stopPropagation();
            clearInterval(timerInterval);
            timeLeft = 0;
            timerDisplay.innerText = "00:00";
        }

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${m}:${s}`;
            
            // Jeśli zwiniesz stoper podczas odliczania, ikonka pokaże Ci czas
            if(!timerEl.classList.contains('expanded') && timeLeft > 0) {
                timerIcon.innerText = `${m}:${s}`;
                timerIcon.style.fontSize = "16px";
            } else if (!timerEl.classList.contains('expanded')) {
                timerIcon.innerText = "⏱️";
                timerIcon.style.fontSize = "24px";
            }
        }

        // ====== OBSŁUGA KALENDARZA (Stary sprawdzony kod) ======
        function changeMonth(step) {
            currentDate.setMonth(currentDate.getMonth() + step);
            updateMonthDisplay();
            loadWorkouts();
        }

        function updateMonthDisplay() {
            document.getElementById('month-display').innerText = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
        }

        async function loadWorkouts() {
            const listContainer = document.getElementById('workout-list-container');
            listContainer.innerHTML = '<div class="empty-state">Ładowanie treningów...</div>';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1).toISOString().split('T')[0];
            const lastDay = new Date(year, month + 1, 0).toISOString().split('T')[0];

            const { data, error } = await supabaseClient
                .from('workout_plan')
                .select('*')
                .gte('scheduled_date', firstDay)
                .lte('scheduled_date', lastDay)
                .order('scheduled_date', { ascending: true });

            if (error || !data || data.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">Brak zaplanowanych treningów na ten miesiąc.<br><br>Kliknij "+ Zaplanuj", aby coś dodać.</div>';
                return;
            }

            listContainer.innerHTML = '';
            data.forEach(workout => {
                const wDate = new Date(workout.scheduled_date);
                const dayNumber = wDate.getDate();
                const dayStr = dayNames[wDate.getDay()];
                const completedClass = workout.is_completed ? 'completed' : '';

                const html = `
                <div class="workout-card ${completedClass}">
                    <div class="workout-info">
                        <div class="workout-date-box">
                            <span class="workout-day">${dayNumber}</span>
                            <span class="workout-weekday">${dayStr}</span>
                        </div>
                        <div class="workout-details">
                            <h4 class="workout-title">${workout.title}</h4>
                            ${workout.details ? `<p class="workout-desc">${workout.details}</p>` : ''}
                        </div>
                    </div>
                    <div class="checkbox-container" onclick="toggleCompleted(${workout.id}, ${workout.is_completed})">
                        <div class="custom-checkbox"></div>
                    </div>
                </div>`;
                listContainer.innerHTML += html;
            });
        }

        async function toggleCompleted(id, currentStatus) {
            const { error } = await supabaseClient.from('workout_plan').update({ is_completed: !currentStatus }).eq('id', id);
            if (!error) loadWorkouts(); 
        }

        function openModal() {
            document.getElementById('add-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('add-title').value = '';
            document.getElementById('add-details').value = '';
            document.getElementById('add-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('add-modal').style.display = 'none'; }

        async function saveWorkout() {
            const dateVal = document.getElementById('add-date').value;
            const titleVal = document.getElementById('add-title').value;
            const detailsVal = document.getElementById('add-details').value;

            if (!dateVal || !titleVal) return alert("Wybierz datę i wpisz nazwę treningu!");

            const { error } = await supabaseClient.from('workout_plan').insert([{ scheduled_date: dateVal, title: titleVal, details: detailsVal }]);

            if (!error) {
                closeModal();
                const addedDate = new Date(dateVal);
                currentDate.setFullYear(addedDate.getFullYear()); currentDate.setMonth(addedDate.getMonth());
                updateMonthDisplay(); loadWorkouts(); 
            } else {
                alert("Wystąpił błąd przy zapisie treningu.");
            }
        }

        updateMonthDisplay();
        loadWorkouts();
    </script>
</body>
</html>
