<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPlan - Twój Pulpit</title>
    
    <!-- Biblioteka Supabase do komunikacji z bazą -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Główne kolory i styl całej strony */
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-color: #d4a373; /* Złoty kolor z logo */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Pasek nawigacji */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
        }

        .logo {
            color: var(--accent-color);
            font-size: 24px;
            font-weight: bold;
        }

        /* Układ siatki dla kafelków (Grid) */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* Wygląd pojedynczego kafelka */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card h3 {
            margin-top: 0;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">||= FITPLAN</div>
        <nav>
            <span style="color: var(--accent-color); margin-right: 15px;">PULPIT</span>
            <span style="color: var(--text-muted);">DIETA</span>
        </nav>
    </header>

    <!-- Tutaj będą nasze puste kafelki czekające na dane z Supabase -->
    <main class="dashboard-grid">
        
        <div class="card">
            <h3>Kalorie</h3>
            <div class="value" id="kcal-value">-- kcal</div>
            <div style="color: var(--text-muted); font-size: 12px;">z zaplanowanych</div>
        </div>

        <div class="card">
            <h3>Białko</h3>
            <div class="value" id="protein-value">-- g</div>
            <div style="color: var(--text-muted); font-size: 12px;">z zaplanowanych</div>
        </div>

        <div class="card">
            <h3>Woda</h3>
            <div class="value" id="water-value">-- L / -- L</div>
            <div style="color: var(--text-muted); font-size: 12px;">z dziennego celu</div>
        </div>

    </main>

    <script>
        // Tutaj wkrótce wpiszemy kod łączący nas z Supabase!
        console.log("Strona załadowana pomyślnie. Czekamy na klucze Supabase.");
    </script>

</body>
</html>
