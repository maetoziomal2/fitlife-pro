<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPlan - Twój Pulpit</title>
    
    <!-- Biblioteka Supabase do komunikacji z bazą -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Główne kolory i styl całej strony */
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-color: #d4a373; /* Złoty kolor z logo */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Pasek nawigacji */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
        }

        .logo {
            color: var(--accent-color);
            font-size: 24px;
            font-weight: bold;
        }

        /* Układ siatki dla kafelków (Grid) */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* Wygląd pojedynczego kafelka */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card h3 {
            margin-top: 0;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">||= FITPLAN</div>
        <nav>
            <span style="color: var(--accent-color); margin-right: 15px;">PULPIT</span>
            <span style="color: var(--text-muted);">DIETA</span>
        </nav>
    </header>

    <!-- Tutaj będą nasze puste kafelki czekające na dane z Supabase -->
    <main class="dashboard-grid">
        
        <div class="card">
            <h3>Kalorie</h3>
            <div class="value" id="kcal-value">-- kcal</div>
            <div style="color: var(--text-muted); font-size: 12px;">z zaplanowanych</div>
        </div>

        <div class="card">
            <h3>Białko</h3>
            <div class="value" id="protein-value">-- g</div>
            <div style="color: var(--text-muted); font-size: 12px;">z zaplanowanych</div>
        </div>

        <div class="card">
            <h3>Woda</h3>
            <div class="value" id="water-value">-- L / -- L</div>
            <div style="color: var(--text-muted); font-size: 12px;">z dziennego celu</div>
        </div>

    </main>

        <script>
        // 1. Inicjalizacja połączenia
        const supabaseUrl = 'https://ttgeuikoyfcgiboajhcf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0Z2V1aWtveWZjZ2lib2FqaGNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzQwODQsImV4cCI6MjEwMjU1MDA4NH0.bdBemCIUCBkbrJx2h9iN44OuQIAmeGkTTQjwRMev-G4';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Funkcja pobierająca dane
        async function fetchStats() {
            console.log("Próbuję pobrać dane...");
            
            let { data: daily_stats, error } = await supabase
                .from('daily_stats')
                .select('*')
                .limit(1)
                .single(); // Pobieramy jeden (nasz pusty) wiersz

            if (error) {
                console.error('Mamy problem:', error);
                return;
            }

            // 3. Jeśli są dane, wklejamy je na stronę
            if (daily_stats) {
                document.getElementById('kcal-value').innerText = daily_stats.calories_consumed + ' kcal';
                document.getElementById('protein-value').innerText = daily_stats.protein_consumed + ' g';
                document.getElementById('water-value').innerText = daily_stats.water_consumed + ' L / 2.5 L';
            }
        }

        // 4. Uruchamiamy funkcję
        fetchStats();
    </script>

</body>
</html>
