<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPlan - Kalkulator</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --bg-color: #050505; --card-bg: #121212; --card-border: #222222; --text-main: #ffffff; --text-muted: #888888; --accent-color: #d4a373; --accent-hover: #b0865c; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 30px 0; flex-wrap: wrap; gap: 15px; }
        .logo { color: var(--accent-color); font-size: 22px; font-weight: bold; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        header nav { display: flex; gap: 20px; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
        header nav a { color: var(--text-muted); text-decoration: none; text-transform: uppercase; }
        header nav a:hover { color: var(--text-main); }
        header nav a.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 5px; }
        .gear-icon { color: var(--text-muted); font-size: 20px; text-decoration: none; transition: 0.3s; }
        .gear-icon:hover { color: var(--text-main); }
        .mobile-nav { display: none; background-color: var(--bg-color); border-top: 1px solid var(--card-border); position: fixed; bottom: 0; left: 0; width: 100%; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .mobile-nav a { color: var(--text-muted); text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-transform: uppercase; }
        .mobile-nav a.active { color: var(--accent-color); }
        .mobile-nav .icon { font-size: 20px; }

        .card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        .page-title { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group.full { grid-column: span 2; }
        .input-group label { font-size: 12px; color: var(--text-muted); }
        .input-group input, .input-group select { background-color: var(--bg-color); border: 1px solid var(--card-border); color: white; padding: 12px; border-radius: 6px; outline: none; font-family: inherit; width: 100%; box-sizing: border-box; }
        .input-group input:focus, .input-group select:focus { border-color: var(--accent-color); }
        
        .btn { background-color: var(--accent-color); color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 14px; width: 100%; transition: 0.3s; }
        .btn:hover { background-color: var(--accent-hover); }

        /* WYNIKI */
        #results-section { display: none; margin-top: 20px; border-top: 1px dashed var(--card-border); padding-top: 20px; }
        .result-number { font-size: 32px; font-weight: bold; color: var(--accent-color); text-align: center; margin-bottom: 20px; }
        .macros-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; margin-bottom: 20px; }
        .macro-box { background-color: var(--bg-color); border: 1px solid var(--card-border); padding: 15px; border-radius: 8px; }
        .macro-val { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        
        .btn-success { background-color: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 14px; width: 100%; transition: 0.3s; }
        .btn-success:hover { background-color: #218838; }

        @media (max-width: 900px) { body { padding-bottom: 80px; } header nav { display: none; } .mobile-nav { display: flex; } .form-grid { grid-template-columns: 1fr; } .input-group.full { grid-column: span 1; } }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>||=</span> FITPLAN</div>
        <nav>
            <a href="index.html">PULPIT</a>
            <a href="dieta.html">DIETA</a>
            <a href="trening.html">TRENING</a>
            <a href="postepy.html">POSTĘPY</a>
            <a href="kalkulator.html" class="active">KALKULATOR</a>
        </nav>
        <a href="ustawienia.html" class="gear-icon">⚙</a>
    </header>

    <main style="max-width: 600px; margin: 0 auto;">
        <div class="card">
            <div class="page-title"><span style="color: var(--accent-color);">🧮</span> Kalkulator Zapotrzebowania</div>
            
            <div class="form-grid">
                <div class="input-group">
                    <label>Płeć</label>
                    <select id="calc-gender">
                        <option value="male">Mężczyzna</option>
                        <option value="female">Kobieta</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Wiek</label>
                    <input type="number" id="calc-age" placeholder="np. 25">
                </div>
                <div class="input-group">
                    <label>Waga (kg)</label>
                    <input type="number" id="calc-weight" placeholder="np. 80">
                </div>
                <div class="input-group">
                    <label>Wzrost (cm)</label>
                    <input type="number" id="calc-height" placeholder="np. 180">
                </div>
                <div class="input-group full">
                    <label>Aktywność fizyczna</label>
                    <select id="calc-activity">
                        <option value="1.2">Brak aktywności (praca siedząca)</option>
                        <option value="1.375">Niska (trening 1-3 razy w tyg.)</option>
                        <option value="1.55">Średnia (trening 3-5 razy w tyg.)</option>
                        <option value="1.725">Wysoka (trening codziennie)</option>
                        <option value="1.9">Bardzo wysoka (praca fizyczna + trening)</option>
                    </select>
                </div>
                <div class="input-group full">
                    <label>Cel</label>
                    <select id="calc-goal">
                        <option value="-500">Redukcja wagi (-500 kcal)</option>
                        <option value="0">Utrzymanie wagi</option>
                        <option value="300">Budowa masy mięśniowej (+300 kcal)</option>
                    </select>
                </div>
            </div>

            <button class="btn" onclick="calculateMacros()">Oblicz Makro</button>

            <!-- SEKCJA WYNIKÓW (UKRYTA NA STARCIE) -->
            <div id="results-section">
                <div style="font-size: 12px; color: var(--text-muted); text-align: center; text-transform: uppercase;">Twoje dzienne zapotrzebowanie</div>
                <div class="result-number"><span id="res-kcal">0</span> kcal</div>
                
                <div class="macros-grid">
                    <div class="macro-box">
                        <div class="macro-val" style="color: #4da6ff;"><span id="res-protein">0</span>g</div>
                        <div style="font-size: 11px; color: var(--text-muted);">BIAŁKO</div>
                    </div>
                    <div class="macro-box">
                        <div class="macro-val" style="color: #ffcc00;"><span id="res-fats">0</span>g</div>
                        <div style="font-size: 11px; color: var(--text-muted);">TŁUSZCZE</div>
                    </div>
                    <div class="macro-box">
                        <div class="macro-val" style="color: #66cc66;"><span id="res-carbs">0</span>g</div>
                        <div style="font-size: 11px; color: var(--text-muted);">WĘGLOWODANY</div>
                    </div>
                </div>

                <button class="btn-success" onclick="saveToSettings()">💾 Zastosuj do mojego profilu</button>
            </div>
        </div>
    </main>

    <nav class="mobile-nav">
        <a href="index.html"><span class="icon">🏠</span><span>Pulpit</span></a>
        <a href="dieta.html"><span class="icon">🍴</span><span>Dieta</span></a>
        <a href="trening.html"><span class="icon">🏋️</span><span>Trening</span></a>
        <a href="postepy.html"><span class="icon">📈</span><span>Postępy</span></a>
        <a href="kalkulator.html" class="active"><span class="icon">🧮</span><span>Kalkulator</span></a>
    </nav>

    <script>
        const supabaseUrl = 'https://ttgeuikoyfcgiboajhcf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0Z2V1aWtveWZjZ2lib2FqaGNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzQwODQsImV4cCI6MjEwMjU1MDA4NH0.bdBemCIUCBkbrJx2h9iN44OuQIAmeGkTTQjwRMev-G4';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // Zmienne globalne do przechowania wyników
        let finalKcal = 0;
        let finalProtein = 0;
        let finalFats = 0;
        let finalCarbs = 0;

        function calculateMacros() {
            const gender = document.getElementById('calc-gender').value;
            const age = parseInt(document.getElementById('calc-age').value);
            const weight = parseFloat(document.getElementById('calc-weight').value);
            const height = parseFloat(document.getElementById('calc-height').value);
            const activity = parseFloat(document.getElementById('calc-activity').value);
            const goal = parseInt(document.getElementById('calc-goal').value);

            if (!age || !weight || !height) {
                alert("Wypełnij wszystkie pola, aby obliczyć wynik!");
                return;
            }

            // Wzór Mifflin-St Jeor na BMR (Podstawowa Przemiana Materii)
            let bmr = (10 * weight) + (6.25 * height) - (5 * age);
            if (gender === 'male') {
                bmr += 5;
            } else {
                bmr -= 161;
            }

            // Całkowita Przemiana Materii (TDEE)
            const tdee = bmr * activity;

            // Dodajemy lub odejmujemy kalorie w zależności od celu
            finalKcal = Math.round(tdee + goal);

            // Podział Makro (Standard dla sportowców/ćwiczących):
            // Białko: 2g na kg masy ciała
            // Tłuszcze: 1g na kg masy ciała
            // Reszta z kalorii idzie w węglowodany
            
            finalProtein = Math.round(weight * 2.0);
            finalFats = Math.round(weight * 1.0);
            
            const proteinKcal = finalProtein * 4; // 1g białka = 4 kcal
            const fatsKcal = finalFats * 9;       // 1g tłuszczu = 9 kcal
            
            const leftoverKcal = finalKcal - (proteinKcal + fatsKcal);
            finalCarbs = Math.round(leftoverKcal / 4); // 1g węgli = 4 kcal

            // Wyświetlenie na ekranie
            document.getElementById('res-kcal').innerText = finalKcal;
            document.getElementById('res-protein').innerText = finalProtein;
            document.getElementById('res-fats').innerText = finalFats;
            document.getElementById('res-carbs').innerText = finalCarbs;

            document.getElementById('results-section').style.display = 'block';
        }

        async function saveToSettings() {
            // Wysyłamy nasze wyliczenia prosto do Supabase, do tabeli Ustawień (user_settings, id=1)
            const updates = {
                id: 1,
                target_kcal: finalKcal,
                target_protein: finalProtein,
                target_fats: finalFats,
                target_carbs: finalCarbs
            };

            const { error } = await supabaseClient
                .from('user_settings')
                .upsert(updates);

            if (!error) {
                alert("Twoje cele zostały zaktualizowane! Zobacz zmiany na Pulpicie.");
                window.location.href = "index.html"; // Po zapisie przenosi nas na stronę główną
            } else {
                console.error("Błąd zapisu:", error);
                alert("Wystąpił błąd przy zapisywaniu celów.");
            }
        }
    </script>
</body>
</html>
