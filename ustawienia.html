<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPlan - Ustawienia</title>
    
    <!-- Biblioteka Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --bg-color: #050505; --card-bg: #121212; --card-border: #222222; --text-main: #ffffff; --text-muted: #888888; --accent-color: #d4a373; --accent-hover: #b0865c; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 30px 0; flex-wrap: wrap; gap: 15px; }
        .logo { color: var(--accent-color); font-size: 22px; font-weight: bold; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        header nav { display: flex; gap: 20px; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
        header nav a { color: var(--text-muted); text-decoration: none; text-transform: uppercase; }
        header nav a:hover { color: var(--text-main); }
        header nav a.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 5px; }
        .gear-icon { color: var(--accent-color); font-size: 20px; text-decoration: none; transition: 0.3s; }
        .mobile-nav { display: none; background-color: var(--bg-color); border-top: 1px solid var(--card-border); position: fixed; bottom: 0; left: 0; width: 100%; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .mobile-nav a { color: var(--text-muted); text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-transform: uppercase; }
        .mobile-nav a.active { color: var(--accent-color); }
        .mobile-nav .icon { font-size: 20px; }
        .settings-header { font-size: 20px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        .section-title { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 12px; color: var(--text-muted); }
        .input-group input { background-color: var(--bg-color); border: 1px solid var(--card-border); color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; }
        .input-group input:focus { border-color: var(--accent-color); }
        .full-width { grid-column: span 2; }
        .btn-save { background-color: var(--accent-color); color: #000; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; font-size: 14px; margin-top: 10px; transition: 0.3s; }
        .btn-save:hover { background-color: var(--accent-hover); }
        #toast { visibility: hidden; min-width: 250px; background-color: #4da6ff; color: #fff; text-align: center; border-radius: 8px; padding: 15px; position: fixed; z-index: 1001; left: 50%; bottom: 80px; transform: translateX(-50%); font-weight: bold; font-size: 14px; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 80px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 80px; opacity: 1;} to {bottom: 0; opacity: 0;} }
        @media (max-width: 900px) { body { padding-bottom: 80px; } header nav { display: none; } .mobile-nav { display: flex; } .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }

        /* --- ANIMACJE PRZEJŚĆ --- */
        body {
            animation: pageFadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .page-exit {
            animation: pageFadeOut 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
        }
        @keyframes pageFadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pageFadeOut {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>||=</span> FITPLAN</div>
        <nav>
            <a href="index.html">PULPIT</a>
            <a href="dieta.html">DIETA</a>
            <a href="trening.html">TRENING</a>
            <a href="postepy.html">POSTĘPY</a>
            <a href="kalkulator.html">KALKULATOR</a>
        </nav>
        <a href="ustawienia.html" class="gear-icon">⚙</a>
    </header>

    <main style="max-width: 800px; margin: 0 auto;">
        
        <div class="settings-header">
            <span style="color: var(--accent-color);">⚙</span> Ustawienia Konta
        </div>

        <div class="card">
            <div class="section-title">Profil i Waga</div>
            <div class="form-grid">
                <div class="input-group full-width">
                    <label>Imię / Pseudonim</label>
                    <input type="text" id="set-name" placeholder="Twoje imię">
                </div>
                <div class="input-group">
                    <label>Waga początkowa (kg)</label>
                    <input type="number" step="0.1" id="set-start-weight" placeholder="np. 85.0">
                </div>
                <div class="input-group">
                    <label>Cel wagi (kg)</label>
                    <input type="number" step="0.1" id="set-target-weight" placeholder="np. 75.0">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">Cele Dietetyczne (Dzienne)</div>
            <div class="form-grid">
                <div class="input-group full-width">
                    <label>Zapotrzebowanie (Kcal)</label>
                    <input type="number" id="set-kcal" placeholder="np. 2500" style="border-color: var(--accent-color);">
                </div>
                <div class="input-group">
                    <label>Białko (g)</label>
                    <input type="number" id="set-protein" placeholder="np. 160">
                </div>
                <div class="input-group">
                    <label>Tłuszcze (g)</label>
                    <input type="number" id="set-fats" placeholder="np. 80">
                </div>
                <div class="input-group full-width">
                    <label>Węglowodany (g)</label>
                    <input type="number" id="set-carbs" placeholder="np. 280">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">Codzienne Nawyki</div>
            <div class="form-grid">
                <div class="input-group">
                    <label>Cel Wody (Litry)</label>
                    <input type="number" step="0.1" id="set-water" placeholder="np. 2.5">
                </div>
                <div class="input-group">
                    <label>Cel Kroków</label>
                    <input type="number" id="set-steps" placeholder="np. 10000">
                </div>
            </div>
        </div>

        <button class="btn-save" onclick="saveSettings()">Zapisz Ustawienia</button>

    </main>

    <div id="toast">✅ Ustawienia zostały zapisane!</div>

    <nav class="mobile-nav">
        <a href="index.html"><span class="icon">🏠</span><span>Pulpit</span></a>
        <a href="dieta.html"><span class="icon">🍴</span><span>Dieta</span></a>
        <a href="trening.html"><span class="icon">🏋️</span><span>Trening</span></a>
        <a href="postepy.html"><span class="icon">📈</span><span>Postępy</span></a>
        <a href="kalkulator.html"><span class="icon">🧮</span><span>Kalkulator</span></a>
    </nav>

    <script>
        // Twoje klucze z Supabase
        const supabaseUrl = 'https://ttgeuikoyfcgiboajhcf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0Z2V1aWtveWZjZ2lib2FqaGNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzQwODQsImV4cCI6MjEwMjU1MDA4NH0.bdBemCIUCBkbrJx2h9iN44OuQIAmeGkTTQjwRMev-G4';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 1. POBIERANIE DANYCH PRZY WEJŚCIU NA STRONĘ
        async function loadSettings() {
            let { data, error } = await supabaseClient.from('user_settings').select('*').eq('id', 1).single();
            if (data) {
                document.getElementById('set-name').value = data.name || '';
                document.getElementById('set-start-weight').value = data.start_weight || '';
                document.getElementById('set-target-weight').value = data.target_weight || '';
                document.getElementById('set-kcal').value = data.target_kcal || '';
                document.getElementById('set-protein').value = data.target_protein || '';
                document.getElementById('set-fats').value = data.target_fats || '';
                document.getElementById('set-carbs').value = data.target_carbs || '';
                document.getElementById('set-water').value = data.target_water || '';
                document.getElementById('set-steps').value = data.target_steps || '';
            }
        }
        
        loadSettings(); // Odpalamy funkcję na starcie

        // 2. ZAPISYWANIE DANYCH DO BAZY (wersja poprawiona)
        async function saveSettings() {
            
            // Nasz mały pomocnik: jeśli okienko jest puste, daj 'null'
            const getVal = (id) => document.getElementById(id).value === "" ? null : document.getElementById(id).value;

            // Zbieramy dane z okienek
            const updates = {
                id: 1,
                name: document.getElementById('set-name').value || 'Użytkownik', // Jak brak imienia, daj 'Użytkownik'
                start_weight: getVal('set-start-weight'),
                target_weight: getVal('set-target-weight'),
                target_kcal: getVal('set-kcal'),
                target_protein: getVal('set-protein'),
                target_fats: getVal('set-fats'),
                target_carbs: getVal('set-carbs'),
                target_water: getVal('set-water'),
                target_steps: getVal('set-steps')
            };

            // Wysyłamy do Supabase
            const { error } = await supabaseClient.from('user_settings').upsert(updates);

            if (!error) {
                // Pokazujemy sukces (Toast)
                var toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
            } else {
                console.error("Błąd zapisu:", error);
                alert("Wystąpił błąd przy zapisie. Sprawdź konsolę.");
            }
        }

        // --- PŁYNNE PRZEJŚCIA MIĘDZY KARTAMI ---
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                const target = this.getAttribute('href');
                
                // Jeśli link prowadzi do innej zakładki (pliku .html)
                if(target && target.includes('.html')) {
                    e.preventDefault(); // Zatrzymujemy natychmiastowy przeskok
                    
                    // Odpalamy animację wyjścia
                    document.body.classList.add('page-exit');
                    
                    // Czekamy 300 milisekund i dopiero wtedy zmieniamy stronę
                    setTimeout(() => {
                        window.location.href = target;
                    }, 300);
                }
            });
        });
    </script>
</body>
</html>
