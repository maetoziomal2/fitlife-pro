<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPlan - Plan Diety</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --bg-color: #050505; --card-bg: #121212; --card-border: #222222; --text-main: #ffffff; --text-muted: #888888; --accent-color: #d4a373; --accent-hover: #b0865c; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 30px 0; flex-wrap: wrap; gap: 15px; }
        .logo { color: var(--accent-color); font-size: 22px; font-weight: bold; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        header nav { display: flex; gap: 20px; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
        header nav a { color: var(--text-muted); text-decoration: none; text-transform: uppercase; }
        header nav a:hover { color: var(--text-main); }
        header nav a.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 5px; }
        .gear-icon { color: var(--text-muted); font-size: 20px; text-decoration: none; transition: 0.3s; }
        .gear-icon:hover { color: var(--text-main); }
        .mobile-nav { display: none; background-color: var(--bg-color); border-top: 1px solid var(--card-border); position: fixed; bottom: 0; left: 0; width: 100%; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .mobile-nav a { color: var(--text-muted); text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-transform: uppercase; }
        .mobile-nav a.active { color: var(--accent-color); }
        .mobile-nav .icon { font-size: 20px; }
        
        .diet-header { display: flex; justify-content: space-between; align-items: center; background-color: var(--card-bg); border: 1px solid var(--card-border); padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; }
        .date-selector { display: flex; align-items: center; gap: 15px; font-weight: bold; }
        .date-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }
        .date-btn:hover { color: var(--accent-color); }
        
        .meal-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .meal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 15px; }
        .meal-title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: bold; }
        
        /* STYLE DLA LISTY PRODUKTÓW W POSIŁKU */
        .food-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .food-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: var(--bg-color); border: 1px solid var(--card-border); border-radius: 8px; }
        .food-name { font-size: 13px; font-weight: bold; }
        .food-macros { font-size: 11px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 10px; }
        .food-kcal { font-size: 14px; font-weight: bold; color: var(--accent-color); }

        .add-product-btn { background-color: transparent; color: var(--accent-color); border: 1px dashed var(--accent-color); padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 12px; transition: 0.3s; }
        .add-product-btn:hover { background-color: rgba(212, 163, 115, 0.1); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background-color: var(--card-bg); border: 1px solid var(--accent-color); border-radius: 12px; padding: 25px; width: 90%; max-width: 400px; }
        .modal-content h3 { margin-top: 0; color: var(--accent-color); }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .input-full { width: 100%; margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .input-full label { font-size: 11px; color: var(--text-muted); }
        .input-full input { background-color: var(--bg-color); border: 1px solid var(--card-border); color: white; padding: 10px; border-radius: 6px; width: 90%; outline: none; }
        .modal-grid input { background-color: var(--bg-color); border: 1px solid var(--card-border); color: white; padding: 10px; border-radius: 6px; width: 85%; outline: none; }
        .modal-grid input:focus, .input-full input:focus { border-color: var(--accent-color); }
        
        .modal-buttons { display: flex; gap: 10px; }
        .btn-save { background-color: var(--accent-color); color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-cancel { background-color: transparent; color: white; border: 1px solid var(--text-muted); padding: 10px; border-radius: 6px; cursor: pointer; flex: 1; }

        @media (max-width: 900px) { body { padding-bottom: 80px; } header nav { display: none; } .mobile-nav { display: flex; } }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>||=</span> FITPLAN</div>
        <nav>
            <a href="index.html">PULPIT</a>
            <a href="dieta.html" class="active">DIETA</a>
            <a href="trening.html">TRENING</a>
            <a href="postepy.html">POSTĘPY</a>
            <a href="kalkulator.html">KALKULATOR</a>
        </nav>
        <a href="ustawienia.html" class="gear-icon">⚙</a>
    </header>

    <main style="max-width: 800px; margin: 0 auto;">
        
        <div class="diet-header">
            <div style="color: var(--text-muted); font-size: 12px; text-transform: uppercase;">Podsumowanie dnia</div>
            <div class="date-selector">
                <button class="date-btn">&lt;</button>
                <span>Dzisiaj</span>
                <button class="date-btn">&gt;</button>
            </div>
            <div style="font-weight: bold; color: var(--accent-color);" id="top-kcal-summary">0 / 0 kcal</div>
        </div>

        <!-- ŚNIADANIE -->
        <div class="meal-card">
            <div class="meal-header"><div class="meal-title"><span>🍳</span> Śniadanie</div></div>
            <div class="food-list" id="list-Śniadanie"></div> <!-- Tu wpadną produkty -->
            <button class="add-product-btn" onclick="openModal('Śniadanie')">+ Dodaj produkt</button>
        </div>

        <!-- II ŚNIADANIE -->
        <div class="meal-card">
            <div class="meal-header"><div class="meal-title"><span>🥪</span> II Śniadanie</div></div>
            <div class="food-list" id="list-II-Śniadanie"></div>
            <button class="add-product-btn" onclick="openModal('II Śniadanie')">+ Dodaj produkt</button>
        </div>

        <!-- OBIAD -->
        <div class="meal-card">
            <div class="meal-header"><div class="meal-title"><span>🥩</span> Obiad</div></div>
            <div class="food-list" id="list-Obiad"></div>
            <button class="add-product-btn" onclick="openModal('Obiad')">+ Dodaj produkt</button>
        </div>

        <!-- PODWIECZOREK -->
        <div class="meal-card">
            <div class="meal-header"><div class="meal-title"><span>🥑</span> Podwieczorek</div></div>
            <div class="food-list" id="list-Podwieczorek"></div>
            <button class="add-product-btn" onclick="openModal('Podwieczorek')">+ Dodaj produkt</button>
        </div>

        <!-- KOLACJA -->
        <div class="meal-card">
            <div class="meal-header"><div class="meal-title"><span>🥗</span> Kolacja</div></div>
            <div class="food-list" id="list-Kolacja"></div>
            <button class="add-product-btn" onclick="openModal('Kolacja')">+ Dodaj produkt</button>
        </div>

    </main>

    <!-- OKIENKO MODAL -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal-content">
            <h3 id="modal-title">Dodaj do: ...</h3>
            
            <div class="input-full">
                <label>Nazwa (np. Płatki owsiane z mlekiem)</label>
                <input type="text" id="add-name" placeholder="Co zjadasz?">
            </div>

            <div class="modal-grid">
                <div>
                    <label style="font-size: 11px; color: var(--accent-color);">Kalorie (kcal)</label>
                    <input type="number" id="add-kcal" placeholder="np. 350">
                </div>
                <div>
                    <label style="font-size: 11px; color: #4da6ff;">Białko (g)</label>
                    <input type="number" id="add-protein" placeholder="np. 30">
                </div>
                <div>
                    <label style="font-size: 11px; color: #ffcc00;">Tłuszcze (g)</label>
                    <input type="number" id="add-fats" placeholder="np. 15">
                </div>
                <div>
                    <label style="font-size: 11px; color: #66cc66;">Węgle (g)</label>
                    <input type="number" id="add-carbs" placeholder="np. 40">
                </div>
            </div>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Anuluj</button>
                <button class="btn-save" onclick="saveFoodToDatabase()">Zapisz</button>
            </div>
        </div>
    </div>

    <nav class="mobile-nav">
        <a href="index.html"><span class="icon">🏠</span><span>Pulpit</span></a>
        <a href="dieta.html" class="active"><span class="icon">🍴</span><span>Dieta</span></a>
        <a href="trening.html"><span class="icon">🏋️</span><span>Trening</span></a>
        <a href="postepy.html"><span class="icon">📈</span><span>Postępy</span></a>
        <a href="kalkulator.html"><span class="icon">🧮</span><span>Kalkulator</span></a>
    </nav>

    <script>
        const supabaseUrl = 'https://ttgeuikoyfcgiboajhcf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0Z2V1aWtveWZjZ2lib2FqaGNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzQwODQsImV4cCI6MjEwMjU1MDA4NH0.bdBemCIUCBkbrJx2h9iN44OuQIAmeGkTTQjwRMev-G4';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let currentDailyStats = {};
        let activeMealCategory = ""; // Zapamiętuje, do którego posiłku właśnie dodajemy

        // POBIERANIE WYNIKÓW I LISTY PRODUKTÓW
        async function loadDietData() {
            // 1. Górny licznik (tak jak było)
            let { data: daily } = await supabaseClient.from('daily_stats').select('*').limit(1).single();
            let { data: goals } = await supabaseClient.from('user_settings').select('*').eq('id', 1).single();
            if (daily) currentDailyStats = daily;
            if (!goals) goals = { target_kcal: 2500 };
            document.getElementById('top-kcal-summary').innerText = `${currentDailyStats.calories_consumed || 0} / ${goals.target_kcal} kcal`;

            // 2. NOWOŚĆ: Pobieranie listy jedzenia
            const { data: foodLogs } = await supabaseClient.from('food_log').select('*');
            
            // Czyszczenie list (żeby się nie dublowały po odświeżeniu)
            const categories = ['Śniadanie', 'II-Śniadanie', 'Obiad', 'Podwieczorek', 'Kolacja'];
            categories.forEach(cat => {
                const el = document.getElementById(`list-${cat}`);
                if(el) el.innerHTML = '';
            });

            // Wrzucanie jedzenia do odpowiednich pudełek
            if (foodLogs) {
                foodLogs.forEach(food => {
                    // Zamieniamy spację na myślnik dla ID (np. II Śniadanie -> II-Śniadanie)
                    let safeId = `list-${food.meal_category.replace(' ', '-')}`;
                    const listContainer = document.getElementById(safeId);
                    
                    if (listContainer) {
                        const html = `
                        <div class="food-item">
                            <div>
                                <div class="food-name">${food.food_name || 'Brak nazwy'}</div>
                                <div class="food-macros">
                                    <span style="color: #4da6ff">B: ${food.protein}g</span>
                                    <span style="color: #ffcc00">T: ${food.fats}g</span>
                                    <span style="color: #66cc66">W: ${food.carbs}g</span>
                                </div>
                            </div>
                            <div class="food-kcal">${food.kcal} kcal</div>
                        </div>
                        `;
                        listContainer.innerHTML += html;
                    }
                });
            }
        }
        
        loadDietData();

        // OBSŁUGA OKIENKA (MODALA)
        function openModal(mealName) {
            activeMealCategory = mealName;
            document.getElementById('modal-title').innerText = "Dodaj do: " + mealName;
            
            // Czyszczenie po poprzednim
            document.getElementById('add-name').value = '';
            document.getElementById('add-kcal').value = '';
            document.getElementById('add-protein').value = '';
            document.getElementById('add-fats').value = '';
            document.getElementById('add-carbs').value = '';
            
            document.getElementById('add-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('add-modal').style.display = 'none';
        }

        // ZAPIS DO BAZY DANYCH
        async function saveFoodToDatabase() {
            const inputName = document.getElementById('add-name').value || "Produkt dodany ręcznie";
            const inputKcal = parseInt(document.getElementById('add-kcal').value) || 0;
            const inputProtein = parseInt(document.getElementById('add-protein').value) || 0;
            const inputFats = parseInt(document.getElementById('add-fats').value) || 0;
            const inputCarbs = parseInt(document.getElementById('add-carbs').value) || 0;

            // KROK A: Zapisz produkt do nowej tabeli "food_log"
            const { error: logError } = await supabaseClient.from('food_log').insert([{
                meal_category: activeMealCategory,
                food_name: inputName,
                kcal: inputKcal,
                protein: inputProtein,
                fats: inputFats,
                carbs: inputCarbs
            }]);

            if (logError) {
                console.error("Błąd zapisu na listę:", logError);
                alert("Wystąpił błąd przy dodawaniu produktu.");
                return; // Przerwij, jeśli się nie udało
            }

            // KROK B: Zaktualizuj licznik główny w "daily_stats" (tak jak robiliśmy wcześniej)
            const updates = {
                calories_consumed: (currentDailyStats.calories_consumed || 0) + inputKcal,
                protein_consumed: (currentDailyStats.protein_consumed || 0) + inputProtein,
                fats_consumed: (currentDailyStats.fats_consumed || 0) + inputFats,
                carbs_consumed: (currentDailyStats.carbs_consumed || 0) + inputCarbs
            };

            await supabaseClient.from('daily_stats').update(updates).eq('id', currentDailyStats.id || 1);

            // Jeśli wszystko się udało:
            closeModal(); 
            loadDietData(); // Odśwież widok strony (zaktualizuje licznik i listę jedzenia)
        }
    </script>
</body>
</html>
